<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ETD catalog viewer</title>
<style>
  :root { color-scheme: light dark;
    --bg:#f7f6f2; --fg:#1e1d1a; --mut:#6b675e; --line:#dedbd2;
    --acc:#845418; --card:#fffefb; }
  @media (prefers-color-scheme: dark) { :root {
    --bg:#191817; --fg:#e8e5df; --mut:#98938a; --line:#33312d;
    --acc:#d9a05b; --card:#201f1d; } }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg);
    font:15px/1.5 system-ui, sans-serif; }
  header { padding:20px 24px 12px; border-bottom:1px solid var(--line); }
  h1 { margin:0 0 2px; font-size:20px; }
  h1 a { color:inherit; text-decoration:none }
  .sub { color:var(--mut); font-size:13px; }
  .sub a { color:var(--acc) }
  #controls { display:flex; gap:12px; align-items:center; flex-wrap:wrap;
    padding:12px 24px; }
  #q { flex:1; min-width:220px; padding:8px 12px; font-size:15px;
    border:1px solid var(--line); border-radius:6px;
    background:var(--card); color:var(--fg); }
  #stats { color:var(--mut); font-size:13px; white-space:nowrap; }
  #rows { padding:0 24px 60px; }
  .rec { padding:10px 0; border-bottom:1px solid var(--line); }
  .t { font-weight:600 }
  .t a { color:var(--fg); text-decoration:none }
  .t a:hover { color:var(--acc) }
  .m { color:var(--mut); font-size:13px; }
  .links { font-size:13px; margin-top:2px }
  .links a { color:var(--acc); text-decoration:none; margin-right:14px }
  .links a:hover { text-decoration:underline }
  #more { margin:20px 24px; padding:10px 18px; font-size:15px;
    border:1px solid var(--line); border-radius:6px;
    background:var(--card); color:var(--fg); cursor:pointer; }
  .err { color:#b3403a; padding:20px 24px; }
  .tog { display:flex; border:1px solid var(--line); border-radius:6px;
    overflow:hidden; flex:none }
  .tog button { border:0; background:var(--card); color:var(--mut);
    padding:8px 14px; font-size:14px; cursor:pointer }
  .tog button[aria-pressed="true"] { background:var(--acc); color:var(--bg);
    font-weight:600 }
  select { padding:8px 10px; font-size:14px; border:1px solid var(--line);
    border-radius:6px; background:var(--card); color:var(--fg); flex:none }
  #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:14px; padding:6px 24px 60px; }
  .card { display:flex; gap:12px; align-items:center; padding:12px;
    background:var(--card); border:1px solid var(--line); border-radius:8px;
    text-decoration:none; color:var(--fg); }
  .card:hover { border-color:var(--acc) }
  .card img, .card .ph { width:44px; height:44px; border-radius:6px;
    object-fit:contain; flex:none; background:var(--card); }
  .card .ph { display:flex; align-items:center; justify-content:center;
    font-weight:700; color:var(--mut); font-size:20px; }
  .card .cn { font-size:14px; line-height:1.35 }
  .badge { font-size:11px; color:var(--mut); border:1px solid var(--line);
    border-radius:10px; padding:1px 8px; margin-left:6px; white-space:nowrap }
  h2.sec { margin:26px 24px 4px; font-size:16px; }
  p.secsub { margin:0 24px 10px; color:var(--mut); font-size:13px }
</style>
</head>
<body>
<header>
  <h1 id="title">ETD catalog viewer</h1>
  <div class="sub" id="subtitle">
    Loading… Pass <code>?item=&lt;identifier&gt;</code> of any
    <a href="https://archive.org/details/etd-catalogs">etd-catalogs</a> item.
  </div>
</header>
<div id="controls">
  <select id="typeSel" hidden aria-label="Filter by record type"></select>
  <select id="sortSel" hidden aria-label="Sort repositories">
    <option value="name">Sort: name</option>
    <option value="records">Sort: records</option>
    <option value="theses">Sort: theses</option>
    <option value="date">Sort: recently catalogued</option>
  </select>
  <button id="sortDir" hidden aria-label="Sort direction"
    style="border:1px solid var(--line); background:var(--card);
    color:var(--fg); border-radius:6px; padding:8px 12px; cursor:pointer;
    font-size:14px; flex:none">↑</button>
  <select id="repoSel" hidden aria-label="Filter repositories">
    <option value="all">All repositories</option>
    <option value="with">With theses</option>
    <option value="focus">Theses-focused</option>
  </select>
  <div class="tog" id="tog" hidden>
    <button id="tAll" aria-pressed="true">All</button>
    <button id="tThes" aria-pressed="false">Theses</button>
  </div>
  <input id="q" type="search" placeholder="Filter by title, author, year…"
         aria-label="Filter records">
  <button id="share" title="Copy a link to this view"
    style="border:1px solid var(--line); background:var(--card);
    color:var(--fg); border-radius:6px; padding:8px 12px; cursor:pointer;
    font-size:14px; flex:none">🔗</button>
  <span id="stats"></span>
</div>
<div id="rows" role="list"></div>
<button id="more" hidden>Show more</button>
<script>
"use strict";
const PAGE = 300;
function setParams(obj) {
  const u = new URL(location.href);
  for (const [k, v] of Object.entries(obj)) {
    if (v === "" || v == null || v === false) u.searchParams.delete(k);
    else u.searchParams.set(k, v === true ? "1" : v);
  }
  history.replaceState({}, "", u);
}
document.addEventListener("DOMContentLoaded", () => {
  const b = document.getElementById("share");
  if (b) b.onclick = async () => {
    try { await navigator.clipboard.writeText(location.href);
          b.textContent = "✓ copied"; }
    catch (e) { prompt("Copy this link:", location.href); }
    setTimeout(() => b.textContent = "🔗", 1500);
  };
});
let all = [], view = [], shown = 0, thesesOnly = false, typeFilter = "";
const THESIS = /thes[ie]s|dissert|doctoral|masterarbeit|bachelorarbeit|habilitation|proefschrift|tesis|tese\b|th[eè]se|etd\b|skripsi|disserta|magister|diplom/i;
function isThesis(r) {
  return (r._th ??= THESIS.test(((r.type || []).join(" ") + " " +
    (r.sets || []).join(" "))));
}
const $ = id => document.getElementById(id);

function best(urls) {
  const http = (urls || []).filter(u => typeof u === "string" && u.startsWith("http"));
  const doc = http.find(u => /\.pdf([?#]|$)|bitstream|\/download|viewcontent/i.test(u));
  return { page: http.find(u => !/\.pdf([?#]|$)/i.test(u)) || http[0], doc, all: http };
}

function row(r) {
  const u = best(r.urls);
  const d = document.createElement("div");
  d.className = "rec"; d.setAttribute("role", "listitem");
  const year = (r.date || "").slice(0, 4);
  const who = (r.creators || []).join("; ");
  const live = u.page || u.doc;
  const t = document.createElement("div"); t.className = "t";
  if (live) {
    const a = document.createElement("a");
    a.href = live; a.textContent = r.title || "(untitled)";
    a.rel = "noopener"; a.target = "_blank"; t.appendChild(a);
  } else t.textContent = r.title || "(untitled)";
  const m = document.createElement("div"); m.className = "m";
  const kind = (r.type || []).slice(0, 2).join(", ");
  const lang = (r.language || []).slice(0, 2).join(", ");
  const subj = (r.subjects || []).slice(0, 3).join(", ");
  m.textContent = [who, year, kind, lang, subj].filter(Boolean).join(" · ");
  m.title = r.oai_id || "";
  const links = document.createElement("div"); links.className = "links";
  const add = (href, label) => {
    const a = document.createElement("a");
    a.href = href; a.textContent = label; a.rel = "noopener";
    a.target = "_blank";
    links.appendChild(a);
  };
  if (live) { add(live, "live ↗"); add("https://web.archive.org/web/2/" + live, "wayback"); }
  if (u.doc && u.doc !== live) {
    add(u.doc, "document ↗");
    add("https://web.archive.org/web/2/" + u.doc, "wayback (document)");
  }
  d.append(t, m, links);
  return d;
}

function render(reset) {
  if (reset) { $("rows").textContent = ""; shown = 0; }
  const frag = document.createDocumentFragment();
  const upto = Math.min(view.length, shown + PAGE);
  for (; shown < upto; shown++) frag.appendChild(row(view[shown]));
  $("rows").appendChild(frag);
  $("more").hidden = shown >= view.length;
  const nth = all.filter(isThesis).length;
  $("stats").textContent =
    `${view.length.toLocaleString()} of ${all.length.toLocaleString()} records` +
    (all.length ? ` · ${nth.toLocaleString()} theses` : "");
}

function applyFilter() {
  const q = $("q").value.trim().toLowerCase();
  setParams({ q: $("q").value.trim(), theses: thesesOnly,
              type: typeFilter });
  let base = thesesOnly ? all.filter(isThesis) : all;
  if (typeFilter) base = base.filter(r =>
    (r.type || []).some(t => String(t).toLowerCase().trim() === typeFilter));
  view = !q ? base : base.filter(r => (r._k ||= (
    (r.title || "") + " " + (r.creators || []).join(" ") + " " + (r.date || "")
  ).toLowerCase()).includes(q));
  render(true);
}
function setMode(t) {
  thesesOnly = t;
  $("tAll").setAttribute("aria-pressed", String(!t));
  $("tThes").setAttribute("aria-pressed", String(t));
  applyFilter();
}

async function directory() {
  document.title = "Institutional Repositories of the World, including Theses";
  $("title").textContent = "Institutional Repositories of the World, including Theses";
  $("subtitle").innerHTML = "Complete repository catalogs -- theses, papers, and more -- gathered by the " +
    "<a href='https://archive.org/details/etd-catalogs'>Internet Archive " +
    "Europe ETD project</a> -- click one to browse its theses with live " +
    "and Wayback Machine links.";
  $("q").placeholder = "Filter repositories\u2026";
  const grid = document.createElement("div");
  grid.style.paddingBottom = "60px";
  $("rows").replaceWith(grid);
  $("more").remove();
  const [r, man] = await Promise.all([
    (await fetch(
      "https://archive.org/advancedsearch.php?q=collection%3Aetd-catalogs" +
      "&fl%5B%5D=identifier&fl%5B%5D=title&fl%5B%5D=publicdate&rows=10000&output=json")).json(),
    fetch("manifest.json").then(x => x.json()).catch(() => ({})),
    ]);
  const scrape = await fetch("oaiscrape.json").then(x => x.json())
    .catch(() => ({}));
  const docs = (r.response.docs || []).map(d => ({
    id: d.identifier,
    name: (d.title || d.identifier).replace(/^Repository catalog of /, ""),
    kind: (man[d.identifier] || {}).k || "inst",
    st: (man[d.identifier] || {}).s || "active",
    th: (man[d.identifier] || {}).t || 0,
    tot: (man[d.identifier] || {}).n || 0,
    pd: d.publicdate || ""
  }));
  $("repoSel").hidden = $("sortSel").hidden = $("sortDir").hidden = false;
  const P0 = new URLSearchParams(location.search);
  let repoMode = P0.get("show") || "all",
      sortBy = P0.get("sort") || "name",
      asc = P0.get("dir") !== "desc" && (P0.get("sort") || "name") === "name"
            ? P0.get("dir") !== "desc" : P0.get("dir") === "asc";
  if (P0.get("q")) $("q").value = P0.get("q");
  $("repoSel").value = repoMode; $("sortSel").value = sortBy;
  $("sortDir").textContent = asc ? "↑" : "↓";
  const redraw = () => draw($("q").value.trim().toLowerCase());
  $("repoSel").onchange = () => { repoMode = $("repoSel").value; redraw(); };
  $("sortSel").onchange = () => { sortBy = $("sortSel").value;
    asc = sortBy === "name";           // sensible defaults per key
    $("sortDir").textContent = asc ? "↑" : "↓"; redraw(); };
  $("sortDir").onclick = () => { asc = !asc;
    $("sortDir").textContent = asc ? "↑" : "↓"; redraw(); };
  const SORTS = {
    name: (a, b) => a.name.localeCompare(b.name),
    records: (a, b) => a.tot - b.tot,
    theses: (a, b) => a.th - b.th,
    date: (a, b) => a.pd.localeCompare(b.pd)
  };
  const card = d => {
    const a = document.createElement("a");
    a.className = "card";
    a.href = d.scrapeHost ? ("https://web.archive.org/web/2/https://" +
                             d.scrapeHost + "/") : "?item=" + d.id;
    a.target = "_blank"; a.rel = "noopener";
    const img = document.createElement("img");
    img.loading = "lazy"; img.alt = "";
    img.src = d.scrapeHost ? "data:," : "logos/" + d.id + ".png";
    let tried = 0;
    img.onerror = () => {
      if (tried++ === 0) {
        img.src = "https://archive.org/services/img/" + d.id;
      } else {
        const ph = document.createElement("div"); ph.className = "ph";
        ph.textContent = (d.name[0] || "?").toUpperCase();
        img.replaceWith(ph);
      }
    };
    const n = document.createElement("div"); n.className = "cn";
    n.textContent = d.name;
    if (d.tot || d.th) {
      const c = document.createElement("div");
      c.style.cssText = "font-size:12px;color:var(--mut)";
      c.textContent = d.scrapeHost
        ? d.th.toLocaleString() + " thesis URLs in the scrape"
        : [d.tot ? d.tot.toLocaleString() + " records" : "",
           d.th ? d.th.toLocaleString() + " theses" : ""]
          .filter(Boolean).join(" · ");
      n.appendChild(c);
    }
    if (d.st === "archive") {
      const b = document.createElement("span");
      b.className = "badge"; b.textContent = "archive only";
      b.title = "The original site no longer answers; this catalog and the " +
        "Wayback Machine are what survives.";
      n.appendChild(b);
    }
    a.append(img, n);
    return a;
  };
  const draw = q => {
    setParams({ q: $("q").value.trim(), show: repoMode === "all" ? "" : repoMode,
                sort: sortBy === "name" ? "" : sortBy,
                dir: asc ? "" : "desc" });
    grid.textContent = "";
    let f = docs.filter(d => !q || d.name.toLowerCase().includes(q));
    if (repoMode === "with") f = f.filter(d => d.th > 0);
    if (repoMode === "focus") f = f.filter(d => d.th > 0 && d.th * 2 >= d.tot);
    f = f.slice().sort(SORTS[sortBy]);
    if (!asc) f.reverse();
    $("stats").textContent =
      `${f.length.toLocaleString()} of ${docs.length.toLocaleString()} repositories`;
    const sections = [
      ["Institutional repositories", "Universities and research institutions.",
       f.filter(d => d.kind === "inst")],
      ["Aggregators & national portals",
       "Union catalogs, national libraries, and resolver services.",
       f.filter(d => d.kind === "agg")],
      ["Seen in the 2026-02 web-wide OAI scrape — catalog items to come",
       "Repositories holding theses in Internet Archive's February 2026 " +
       "OAI scrape that this project has not yet catalogued individually.",
       Object.entries(scrape)
         .filter(([h]) => !q || h.toLowerCase().includes(q))
         .map(([h, n]) => ({ scrapeHost: h, name: h, th: n, tot: n,
                             st: "active", kind: "scrape" }))]];
    for (const [title, sub, list] of sections) {
      if (!list.length) continue;
      const h = document.createElement("h2"); h.className = "sec";
      h.textContent = `${title} (${list.length.toLocaleString()})`;
      const ps = document.createElement("p"); ps.className = "secsub";
      ps.textContent = sub;
      const g = document.createElement("div"); g.id = "";
      g.style.cssText = getComputedStyle(grid).display ? "" : "";
      g.className = ""; g.setAttribute("style", "");
      const inner = document.createElement("div");
      inner.style.display = "grid";
      inner.style.gridTemplateColumns = "repeat(auto-fill,minmax(240px,1fr))";
      inner.style.gap = "14px"; inner.style.padding = "6px 24px 8px";
      const frag = document.createDocumentFragment();
      const ordered = sortBy === "name" && asc
        ? list.filter(d => d.st !== "archive")
              .concat(list.filter(d => d.st === "archive"))
        : list;
      for (const d of ordered) frag.appendChild(card(d));
      inner.appendChild(frag);
      grid.append(h, ps, inner);
    }
  };
  draw("");
  $("q").addEventListener("input", () => { clearTimeout(window._t);
    window._t = setTimeout(() => draw($("q").value.trim().toLowerCase()), 200); });
}

async function main() {
  const item = new URLSearchParams(location.search).get("item");
  if (!item) { directory(); return; }
  try {
    const meta = await (await fetch(
      `https://archive.org/metadata/${encodeURIComponent(item)}`)).json();
    const name = (meta.metadata && meta.metadata.title) || item;
    $("title").innerHTML = `<a target="_blank" rel="noopener" ` +
      `href="https://archive.org/details/${item}">${name}</a>`;
    document.title = name;
    const files = (meta.files || []).map(f => f.name);
    const rec = files.find(f => f === "records.jsonl") ||
                files.find(f => f.endsWith("records.jsonl.gz")) ||
                files.find(f => /^catalog-2023-sweep-.*\.ndjson\.gz$/.test(f));
    if (!rec) throw new Error("no records.jsonl in this item");
    $("subtitle").innerHTML = `<a href="./">← All repositories</a> · ` +
      "Streaming " + rec + " …";
    $("tog").hidden = false;
    $("tAll").onclick = () => setMode(false);
    $("tThes").onclick = () => setMode(true);
    $("typeSel").onchange = () => { typeFilter = $("typeSel").value; applyFilter(); };
    const P = new URLSearchParams(location.search);
    if (P.get("q")) $("q").value = P.get("q");
    if (P.get("theses") === "1") thesesOnly = true;
    if (P.get("type")) typeFilter = P.get("type");
    $("tAll").setAttribute("aria-pressed", String(!thesesOnly));
    $("tThes").setAttribute("aria-pressed", String(thesesOnly));
    let resp;
    try {                       // /cors/ guarantees the header; some
      resp = await fetch(       // datanodes omit it on /download/
        `https://archive.org/cors/${item}/${rec}`);
      if (!resp.ok) throw new Error("cors " + resp.status);
    } catch (e) {
      resp = await fetch(`https://archive.org/download/${item}/${rec}`);
      if (!resp.ok) throw new Error("fetch " + resp.status);
    }
    // Some endpoints serve .gz with Content-Encoding: gzip (browser
    // already decompressed); others serve raw bytes. Sniff the magic
    // bytes instead of trusting names or unreadable cross-origin headers.
    let stream = resp.body;
    {
      const rd = stream.getReader();
      const first = await rd.read();
      const head = first.value || new Uint8Array(0);
      const rest = new ReadableStream({
        start(c) { if (head.length) c.enqueue(head); },
        async pull(c) {
          const { done, value } = await rd.read();
          if (done) c.close(); else c.enqueue(value);
        }
      });
      stream = (head[0] === 0x1f && head[1] === 0x8b)
        ? rest.pipeThrough(new DecompressionStream("gzip"))
        : rest;
    }
    const reader = stream.pipeThrough(new TextDecoderStream()).getReader();
    let buf = "", n = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += value;
      const lines = buf.split("\n"); buf = lines.pop();
      for (const ln of lines) {
        if (!ln) continue;
        try {
          const r = JSON.parse(ln);
          if (r.titles && !r.title) {          // 2023 rescue schema
            r.title = (r.titles || [])[0];
            r.type = r.types; r.language = r.languages;
            r.oai_id = r.oai; r.date = r.datestamp;
            r.subjects = r.subjects || [];
          }
          all.push(r);
        } catch (e) {}
      }
      n = all.length;
      if (n % 5000 < 50) {
        $("subtitle").textContent = `Loaded ${n.toLocaleString()} records…`;
        if (view.length === 0 && all.length >= PAGE) { view = all; render(true); }
      }
    }
    if (buf.trim()) try { all.push(JSON.parse(buf)); } catch (e) {}
    { const c = new Map();
      for (const r of all) for (const t of (r.type || [])) {
        const k = String(t).toLowerCase().trim();
        if (k) c.set(k, (c.get(k) || 0) + 1);
      }
      const top = [...c.entries()].sort((a, b) => b[1] - a[1]).slice(0, 40);
      const sel = $("typeSel");
      sel.innerHTML = "<option value=''>All types</option>" + top.map(
        ([k, n]) => `<option value="${k.replace(/"/g,'&quot;')}">` +
          `${k.slice(0,40)} (${n.toLocaleString()})</option>`).join("");
      sel.hidden = top.length === 0;
      if (typeFilter) sel.value = typeFilter; }
    $("subtitle").innerHTML = `<a href="./">← All repositories</a> · ` +
      `${all.length.toLocaleString()} records from this repository's ` +
      `OAI-PMH catalog · links go to the live site and the ` +
      `<a href="https://web.archive.org" target="_blank" rel="noopener">` +
      `Wayback Machine</a> · <a href="./">Internet Archive Europe ETD ` +
      `project</a> (<a href="https://archive.org/details/etd-catalogs" ` +
      `target="_blank" rel="noopener">collection</a>)`;
    applyFilter();
  } catch (e) {
    const d = document.createElement("div");
    d.className = "err";
    d.textContent = "Could not load this catalog: " + e.message;
    $("rows").replaceWith(d);
  }
}
$("q").addEventListener("input", () => { clearTimeout(window._t);
  window._t = setTimeout(applyFilter, 200); });
$("more").addEventListener("click", () => render(false));
main();
</script>
</body>
</html>
